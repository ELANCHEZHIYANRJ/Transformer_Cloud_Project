<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Monitoring of Distribution Transformer</title>
    <!-- Linked external stylesheet targeting the Flask static directory -->
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <h1>Remote Monitoring of Distribution Transformer</h1>

    <div class="grid">
        <div class="card">
            <div class="label">Secondary Phase Frequency</div>
            <div class="value"><span id="data1">--</span><span class="unit">Hz</span></div>
        </div>
        <div class="card">
            <div class="label">Secondary Phase Voltage</div>
            <div class="value"><span id="data2">--</span><span class="unit">V</span></div>
        </div>
        <div class="card">
            <div class="label">Oil Level</div>
            <div class="value"><span id="data3">--</span><span class="unit">Cm</span></div>
        </div>
        <div class="card">
            <div class="label">Core Temperature</div>
            <div class="value"><span id="data4">--</span><span class="unit">°C</span></div>
        </div>
    </div>

    <div class="status">Dashboard Status: <span id="conn-status" style="color: #ff6b6b;">Disconnected</span></div>

    <script>
        // FIXED: Explicitly maps to your unique live Render web socket instance endpoint
        const socket = new WebSocket('wss://transformer-cloud-project.onrender.com');

        socket.onopen = () => {
            document.getElementById('conn-status').innerText = 'Connected & Listening Globally';
            document.getElementById('conn-status').style.color = '#2ecc71';
        };

        socket.onclose = () => {
            document.getElementById('conn-status').innerText = 'Disconnected';
            document.getElementById('conn-status').style.color = '#ff6b6b';
        };

        socket.onmessage = (event) => {
            const payload = JSON.parse(event.data);
            
            // Format incoming string digits to 2 decimal places for a clean presentation dashboard layout
            if(payload.val1 !== undefined) {
                let num1 = parseFloat(payload.val1);
                document.getElementById('data1').innerText = isNaN(num1) ? payload.val1 : num1.toFixed(2);
            }
            if(payload.val2 !== undefined) {
                let num2 = parseFloat(payload.val2);
                document.getElementById('data2').innerText = isNaN(num2) ? payload.val2 : num2.toFixed(2);
            }
            if(payload.val3 !== undefined) {
                let num3 = parseFloat(payload.val3);
                document.getElementById('data3').innerText = isNaN(num3) ? payload.val3 : num3.toFixed(2);
            }
            if(payload.val4 !== undefined) {
                let num4 = parseFloat(payload.val4);
                document.getElementById('data4').innerText = isNaN(num4) ? payload.val4 : num4.toFixed(2);
            }
        };
    </script>
</body>
</html>
