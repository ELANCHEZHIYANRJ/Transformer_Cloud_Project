<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Monitoring of Distribution Transformer</title>
    <!-- Linked external stylesheet targeting the Flask static directory -->
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <h1>Remote Monitoring of Distribution Transformer</h1>

    <div class="grid">
        <div class="card">
            <div class="label">Secondary Phase Frequency</div>
            <div class="value"><span id="data1">--</span><span class="unit">Hz</span></div>
        </div>
        <div class="card">
            <div class="label">Secondary Phase Voltage</div>
            <div class="value"><span id="data2">--</span><span class="unit">V</span></div>
        </div>
        <div class="card">
            <div class="label">Oil Level</div>
            <div class="value"><span id="data3">--</span><span class="unit">Cm</span></div>
        </div>
        <div class="card">
            <div class="label">Core Temperature</div>
            <div class="value"><span id="data4">--</span><span class="unit">°C</span></div>
        </div>
    </div>

    <div class="status">Dashboard Status: <span id="conn-status" style="color: #ff6b6b;">Disconnected</span></div>

    <script>
        // Change this line to target your unique Render public URL string explicitly:
        const socket = new WebSocket('wss://://onrender.com');

        socket.onopen = () => {
            document.getElementById('conn-status').innerText = 'Connected & Listening';
            document.getElementById('conn-status').style.color = '#2ecc71';
        };

        socket.onclose = () => {
            document.getElementById('conn-status').innerText = 'Disconnected';
            document.getElementById('conn-status').style.color = '#ff6b6b';
        };

        socket.onmessage = (event) => {
            const payload = JSON.parse(event.data);
            if(payload.val1 !== undefined) document.getElementById('data1').innerText = payload.val1;
            if(payload.val2 !== undefined) document.getElementById('data2').innerText = payload.val2;
            if(payload.val3 !== undefined) document.getElementById('data3').innerText = payload.val3;
            if(payload.val4 !== undefined) document.getElementById('data4').innerText = payload.val4;
        };
    </script>
</body>
</html>
